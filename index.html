<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday, Meli 💕</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #000000;
    overflow: hidden;
    font-family: 'Press Start 2P', 'Courier New', monospace;
    image-rendering: pixelated;
  }
  canvas {
    display: block; position: fixed; top: 0; left: 0;
    /* list the older fallbacks first so the modern, truly nearest-neighbor
       "pixelated" keyword wins the cascade on browsers that support both --
       Safari in particular renders "crisp-edges" noticeably softer */
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
    image-rendering: pixelated;
  }

  /* CRT-ish scanline overlay */
  #scan {
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 2;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0.22) 0px,
      rgba(0,0,0,0.22) 1px,
      rgba(0,0,0,0) 2px,
      rgba(0,0,0,0) 3px
    );
    mix-blend-mode: multiply;
  }
  #vignette {
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 2;
    box-shadow: inset 0 0 18vw rgba(0,0,0,0.65);
  }

  #cakeGif {
    position: fixed;
    transform: translate(-50%, 0);
    pointer-events: none;
    z-index: 4;
    opacity: 0;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
    image-rendering: pixelated;
    transition: opacity 0.6s ease;
  }

  #intro {
    position: fixed; inset: 0;
    z-index: 5;
    background: transparent;
    transition: opacity 1s ease;
    pointer-events: none;
  }
  #intro.hidden { opacity: 0; pointer-events: none; }
  #startBtn {
    position: absolute;
    left: 50%;
    top: 60%;
    transform: translate(-50%, 0);
    pointer-events: auto;
  }
  #intro.hidden #startBtn { pointer-events: none; }
  .pixel-btn {
    position: relative;
    font-family: 'Press Start 2P', 'Courier New', monospace;
    padding: 14px 20px;
    font-size: clamp(0.6rem, 2vw, 0.8rem);
    border-radius: 0;
    border: 5px solid #0d3f3b;
    cursor: pointer;
    background: #39c5bb;
    color: #fff5fb;
    letter-spacing: 1px;
    box-shadow:
      inset -4px -4px 0 rgba(0,0,0,0.35),
      inset 4px 4px 0 rgba(255,255,255,0.3),
      0 0 0 4px rgba(57,197,187,0.35);
    transition: transform 0.12s steps(2), box-shadow 0.12s steps(2);
  }
  .pixel-btn:hover {
    transform: translateY(-2px);
    box-shadow:
      inset -4px -4px 0 rgba(0,0,0,0.35),
      inset 4px 4px 0 rgba(255,255,255,0.3),
      0 0 0 6px rgba(57,197,187,0.5);
  }
  .pixel-btn:active {
    transform: translateY(1px);
    box-shadow:
      inset 4px 4px 0 rgba(0,0,0,0.35),
      inset -4px -4px 0 rgba(255,255,255,0.15),
      0 0 0 2px rgba(57,197,187,0.5);
  }
  .pixel-btn canvas {
    display: block;
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
    image-rendering: pixelated;
    /* left is set explicitly in JS once the icon's width is known, so the
       icon+text pair can be centered as one group (see positionButtonGroup) */
  }
  .pixel-icon {
    display: block;
    position: absolute;
    top: 50%;
    left: 0;
    transform: translateY(-50%);
    pointer-events: none;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
    image-rendering: pixelated;
  }

  #replayBtn {
    position: fixed;
    bottom: 30px; left: 50%;
    transform: translateX(-50%);
    padding: 11px 16px;
    font-size: clamp(0.55rem, 1.8vw, 0.7rem);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.8s ease;
    z-index: 6;
  }
  #replayBtn.show { opacity: 1; pointer-events: auto; }
</style>
</head>
<body>

<canvas id="scene"></canvas>
<div id="scan"></div>
<div id="vignette"></div>
<img id="cakeGif" alt="">

<button id="replayBtn" class="pixel-btn"><img id="replayBtnIcon" class="pixel-icon" alt=""><canvas id="replayBtnLabel"></canvas></button>

<div id="intro">
  <button id="startBtn" class="pixel-btn"><img id="startBtnIcon" class="pixel-icon" alt=""><canvas id="startBtnLabel"></canvas></button>
</div>

<script>
// Last-resort safety net: if something throws anywhere during setup on a
// browser/device we haven't tested, don't leave the page silently stuck --
// swap in a plain-text message so it's at least usable instead of blank.
window.addEventListener('error', function(e){
  if(window.__meliFallbackShown) return;
  window.__meliFallbackShown = true;
  try{
    const startBtn = document.getElementById('startBtn');
    if(startBtn) startBtn.textContent = 'START';
    const introEl = document.getElementById('intro');
    if(introEl){
      const msg = document.createElement('div');
      msg.style.cssText = 'position:absolute;top:20%;left:50%;transform:translateX(-50%);color:#fff;font-family:monospace;text-align:center;padding:20px;max-width:80vw;';
      msg.textContent = 'To the most beautiful girl to ever exist <3 (tap Start)';
      introEl.appendChild(msg);
    }
  } catch(err){}
});

      const borL = parseFloat(cs.borderLeftWidth)||0, borR = parseFloat(cs.borderRightWidth)||0;

      // Lay out the icon (if present) and the text label as one centered
      // group: icon flush at the left edge of the content box, text after
      // it with a small gap, button width set exactly to fit both -- same
      // explicit-sizing approach as above, extended to a second element.
      const icon = btn.querySelector('.pixel-icon');
      let iconW = 0, gap = 0;
      if (icon) {
        icon.style.height = h + 'px';
        icon.style.width = h + 'px'; // sprite is a 1:1 square gif
        icon.style.left = (padL + borL) + 'px';
        iconW = h;
        gap = Math.max(4, Math.round(h * 0.3));
      }
      canvasEl.style.left = (padL + borL + iconW + gap) + 'px';
      btn.style.width = Math.ceil(padL + padR + borL + borR + iconW + gap + w) + 'px';
    }
  }
  function resizePixelLabels(){
    pixelLabels.forEach(({el, sizeOpts}) => sizeLabelCanvas(el, sizeOpts));
  }
  // Guard against any mobile-browser text-metrics quirk we haven't seen:
  // if pixel-label generation ever fails, fall back to plain visible text
  // on the button rather than letting the error abort the whole script
  // (which used to leave the entire scene -- stars, planets, everything --
  // stuck blank with just the bare CSS button showing).
  function safeMakePixelLabel(canvasEl, text, sizeOpts){
    try{
      makePixelLabel(canvasEl, text, sizeOpts);
    } catch(err){
      const btn = canvasEl.closest('button');
      if(btn){
        canvasEl.style.display = 'none';
        // Append a text node rather than setting textContent, so this
        // doesn't wipe out the icon <img> sitting alongside the canvas.
        btn.appendChild(document.createTextNode(text));
        btn.style.fontFamily = "'Press Start 2P', 'Courier New', monospace";
      }
    }
  }
  safeMakePixelLabel(document.getElementById('startBtnLabel'), 'START', {minH:25, vw:5.2, maxH:37});
  safeMakePixelLabel(document.getElementById('replayBtnLabel'), 'REPLAY', {minH:21, vw:4.4, maxH:31});
  window.addEventListener('resize', resizePixelLabels);

  const PIXEL_SIZE = 5; // CSS px per retro "pixel" -- bigger = chunkier 8-bit look
  const pixCanvas = document.createElement('canvas');
  const pctx = pixCanvas.getContext('2d');

  let W, H, DPR;
  function resize(){
    // Match the device's real pixel ratio (capped generously) rather than
    // capping at 2 -- on 3x Retina phones a 2x-capped canvas has to be
    // upscaled again by the OS compositor to fill the screen, and that
    // extra upscale is what was showing up as blur on mobile.
    DPR = Math.min(window.devicePixelRatio || 1, 3);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    displayCtx.setTransform(DPR,0,0,DPR,0,0);
    displayCtx.imageSmoothingEnabled = false;

    pixCanvas.width = Math.max(64, Math.floor(W / PIXEL_SIZE));
    pixCanvas.height = Math.max(48, Math.floor(H / PIXEL_SIZE));
    pctx.imageSmoothingEnabled = false;
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- Stars / nebula background ----------
  let stars = [];
  const STAR_COLORS = ['#ffffff','#ffffff','#ffffff','#ffd1e8','#b3f0ff'];
  function makeStars(){
    stars = [];
    const count = Math.floor((W*H)/5000);
    for(let i=0;i<count;i++){
      stars.push({
        x: Math.random()*W,
        y: Math.random()*H,
        s: PIXEL_SIZE*(0.8+Math.random()*1.0),
        phase: Math.random()*Math.PI*2,
        speed: 0.5 + Math.random()*1.2,
        color: STAR_COLORS[Math.floor(Math.random()*STAR_COLORS.length)]
      });
    }
  }
  makeStars();
  window.addEventListener('resize', makeStars);

  function drawBackground(t){
    ctx.fillStyle = '#000000';
    ctx.fillRect(0,0,W,H);

    for(const st of stars){
      const tw = 0.5 + 0.5*Math.sin(t*0.001*st.speed + st.phase);
      ctx.globalAlpha = tw;
      ctx.fillStyle = st.color;
      ctx.fillRect(st.x - st.s/2, st.y - st.s/2, st.s, st.s);
    }
    ctx.globalAlpha = 1;
  }

  // ---------- Two-body gravity simulation ----------
  const G = 45;        // gravitational constant (tuned for visuals)
  const DRAG = 0.0006; // slow energy loss so the orbit decays into a collision

  function makeCraters(seed, count){
    let rnd = seed;
    function rand(){ rnd = (rnd*9301+49297)%233280; return rnd/233280; }
    const list = [];
    for(let i=0;i<count;i++){
      list.push({
        ang: rand()*Math.PI*2,
        distR: rand()*0.6,
        sizeR: rand()*0.16+0.1
      });
    }
    return list;
  }

  function Planet(x,y,vx,vy,r,mass,palette,seed){
    return {
      x,y,vx,vy,r,mass,palette,
      rotation:Math.random()*Math.PI*2,
      spin:(Math.random()*0.4+0.15)*(Math.random()<0.5?-1:1),
      craters: makeCraters(seed, 7)
    };
  }

  const MASS_A = 26, MASS_B = 34, MASS_TOTAL = MASS_A + MASS_B;
  const ECC_FACTOR = 0.75; // fraction of circular-orbit speed -- tuned so they swing close once, then decay into a collision

  let planetA, planetB;
  function initPlanets(){
    const cx = W/2, cy = H/2;
    const spread = Math.min(W,H)*0.26; // start further out
    const angle = Math.random()*Math.PI*2;
    const ax = cx + Math.cos(angle)*spread;
    const ay = cy + Math.sin(angle)*spread;
    const bx = cx - Math.cos(angle)*spread;
    const by = cy - Math.sin(angle)*spread;

    // momentum-conserving tangential velocities (keeps the barycenter fixed
    // at screen center so the pair doesn't drift toward the edges) tuned to
    // an eccentric ellipse: they swing in close once, then -- helped by a
    // little drag -- the orbit decays until the next close pass collides.
    const dx = bx-ax, dy = by-ay;
    const dist = Math.hypot(dx,dy);
    const perp = { x: -dy/dist, y: dx/dist };
    const vCirc = Math.sqrt(G * MASS_TOTAL / dist);
    const vRel = vCirc * ECC_FACTOR;
    const vA = vRel * (MASS_B / MASS_TOTAL);
    const vB = vRel * (MASS_A / MASS_TOTAL);

    planetA = Planet(ax, ay,  perp.x*vA,  perp.y*vA, Math.min(W,H)*0.038+14, MASS_A,
      { base:'#39c5bb', hi:'#9df3ea', outline:'#0d3f3b' }, Math.floor(Math.random()*90000)+1);
    planetB = Planet(bx, by, -perp.x*vB, -perp.y*vB, Math.min(W,H)*0.05+16, MASS_B,
      { base:'#e9edf5', hi:'#ffffff', outline:'#5c5f6b' }, Math.floor(Math.random()*90000)+1);
  }
  initPlanets();

  // classic parametric heart curve, traced into the current (already
  // translated/rotated) context, centered on the origin with "radius" r
  function heartPath(r){
    const steps = 48;
    ctx.beginPath();
    for(let i=0;i<=steps;i++){
      const t = (i/steps)*Math.PI*2;
      const hx = 16*Math.pow(Math.sin(t),3);
      const hy = 13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t);
      const px = (hx/16)*r;
      const py = -(hy/17)*r;
      if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.closePath();
  }

  // cheaper low-poly heart (absolute coords, no save/translate needed) for
  // drawing many small hearts per frame, like explosion sparks
  function heartPathAt(cx, cy, r, steps){
    steps = steps || 10;
    ctx.beginPath();
    for(let i=0;i<=steps;i++){
      const t = (i/steps)*Math.PI*2;
      const hx = 16*Math.pow(Math.sin(t),3);
      const hy = 13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t);
      const px = cx + (hx/16)*r;
      const py = cy - (hy/17)*r;
      if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.closePath();
  }

  function drawPlanet(p){
    ctx.save();
    ctx.translate(p.x, p.y);

    // flat halo ring (no blur -- crisp retro glow)
    ctx.globalAlpha = 0.28;
    ctx.fillStyle = p.palette.hi;
    ctx.beginPath();
    ctx.arc(0,0,p.r + PIXEL_SIZE*1.6, 0, Math.PI*2);
    ctx.fill();
    ctx.globalAlpha = 1;

    ctx.rotate(p.rotation);

    // outline
    ctx.fillStyle = p.palette.outline;
    heartPath(p.r);
    ctx.fill();

    // base body (slightly inset so outline shows as a rim)
    const inset = PIXEL_SIZE*0.8;
    ctx.fillStyle = p.palette.base;
    heartPath(Math.max(1,p.r-inset));
    ctx.fill();

    ctx.save();
    heartPath(Math.max(1,p.r-inset));
    ctx.clip();

    // highlight patch (pseudo pixel-shading)
    ctx.fillStyle = p.palette.hi;
    ctx.globalAlpha = 0.85;
    ctx.beginPath();
    ctx.arc(-p.r*0.32, -p.r*0.32, p.r*0.6, 0, Math.PI*2);
    ctx.fill();
    ctx.globalAlpha = 1;

    // craters
    ctx.fillStyle = 'rgba(0,0,0,0.28)';
    for(const c of p.craters){
      const cx = Math.cos(c.ang)*c.distR*p.r;
      const cy = Math.sin(c.ang)*c.distR*p.r;
      const cs = Math.max(PIXEL_SIZE*0.9, c.sizeR*p.r);
      ctx.fillRect(cx-cs/2, cy-cs/2, cs, cs);
    }
    ctx.restore();

    ctx.restore();
  }

  // ---------- Particles: explosion sparks + drifting pixel stars + shockwave rings ----------
  let sparks = [];
  let sparkles = [];
  let rings = [];
  let flash = 0;

  const SPARK_COLORS = ['#39c5bb','#6fe0d4','#a8f5ec','#ffffff','#1a8c82'];
  const SPARKLE_COLORS = ['#39c5bb','#6fe0d4','#1a8c82','#a8f5ec','#ffffff'];

  function spawnExplosion(x,y){
    flash = 1;
    const sparkCount = 220;
    for(let i=0;i<sparkCount;i++){
      const a = Math.random()*Math.PI*2;
      const sp = Math.random()*11 + 3.5;
      sparks.push({
        x, y,
        vx: Math.cos(a)*sp,
        vy: Math.sin(a)*sp,
        r: Math.random()*7+5,
        life: 0,
        maxLife: Math.random()*50+55,
        color: SPARK_COLORS[Math.floor(Math.random()*SPARK_COLORS.length)]
      });
    }
    for(let i=0;i<5;i++){
      rings.push({
        x, y,
        radius: 10+i*16,
        speed: 7+i*2,
        alpha: 1,
        width: 8,
        color: i%2===0 ? '#ffffff' : '#39c5bb'
      });
    }
  }

  function makeSparkle(x,y,burst){
    const a = Math.random()*Math.PI*2;
    const sp = burst ? Math.random()*24+10 : 0;
    return {
      x, y,
      vx: Math.cos(a)*sp,
      vy: Math.sin(a)*sp - (burst? Math.random()*5:0),
      size: Math.random()*16+20,
      swayPhase: Math.random()*Math.PI*2,
      swaySpeed: Math.random()*0.02+0.01,
      fallSpeed: Math.random()*0.32+0.18,
      color: SPARKLE_COLORS[Math.floor(Math.random()*SPARKLE_COLORS.length)], // mix of blue shades plus some white
      born: performance.now(),
      burstMs: burst ? (Math.random()*900+900) : 0 // how long the outward drift lasts
    };
  }

  function spawnSparkleBurst(x,y){
    const count = 170;
    for(let i=0;i<count;i++){
      sparkles.push(makeSparkle(x,y,true));
    }
  }

  // classic 8-bit "sparkle star": a plus of longer rays with shorter
  // diagonal rays and a bright pixel at the center
  function drawSparkle(p){
    const b = p.size/3;
    ctx.save();
    ctx.translate(Math.round(p.x), Math.round(p.y));

    const diag = b*0.55;
    const diagSize = b*0.6;
    ctx.fillStyle = p.color;
    ctx.fillRect(-diagSize/2 - diag, -diagSize/2 - diag, diagSize, diagSize);
    ctx.fillRect( diag - diagSize/2, -diagSize/2 - diag, diagSize, diagSize);
    ctx.fillRect(-diagSize/2 - diag,  diag - diagSize/2, diagSize, diagSize);
    ctx.fillRect( diag - diagSize/2,  diag - diagSize/2, diagSize, diagSize);

    const rays = [ [0,-b], [0,b], [-b,0], [b,0] ];
    for(const [dx,dy] of rays){
      ctx.fillStyle = p.color;
      ctx.fillRect(dx-b/2, dy-b/2, b, b);
    }

    ctx.fillStyle = '#fff8ec';
    const c = b*0.75;
    ctx.fillRect(-c/2, -c/2, c, c);

    ctx.restore();
  }

  // ---------- State machine ----------
  let state = 'orbit'; // orbit -> collide -> bloom -> text
  let stateTime = 0;
  let collisionPoint = null;
  let ambientSparkleTimer = 0;

  function reset(){
    sparks = [];
    sparkles = [];
    rings = [];
    flash = 0;
    state = 'orbit';
    stateTime = 0;
    collisionPoint = null;
    replayBtn.classList.remove('show');
    initPlanets();
  }

  function update(dt, t){
    stateTime += dt;

    if(state === 'orbit'){
      // normalize physics to a ~60fps "frame" unit so it doesn't depend on
      // the browser's actual frame timing (dt arrives in milliseconds)
      const dtF = dt / 16.67;

      const dx = planetB.x - planetA.x;
      const dy = planetB.y - planetA.y;
      const distSq = dx*dx + dy*dy;
      const dist = Math.sqrt(distSq) || 0.001;

      const force = (G * planetA.mass * planetB.mass) / distSq;
      const fx = (dx/dist) * force;
      const fy = (dy/dist) * force;

      planetA.vx += (fx / planetA.mass) * dtF;
      planetA.vy += (fy / planetA.mass) * dtF;
      planetB.vx -= (fx / planetB.mass) * dtF;
      planetB.vy -= (fy / planetB.mass) * dtF;

      // gentle drag so the orbit decays into a collision
      planetA.vx *= (1-DRAG*dtF); planetA.vy *= (1-DRAG*dtF);
      planetB.vx *= (1-DRAG*dtF); planetB.vy *= (1-DRAG*dtF);

      planetA.x += planetA.vx*dtF; planetA.y += planetA.vy*dtF;
      planetB.x += planetB.vx*dtF; planetB.y += planetB.vy*dtF;
      planetA.rotation += planetA.spin*dtF*0.05;
      planetB.rotation += planetB.spin*dtF*0.05;

      // keep them loosely on screen
      const margin = 60;
      if(planetA.x < margin || planetA.x > W-margin) planetA.vx *= -0.6;
      if(planetA.y < margin || planetA.y > H-margin) planetA.vy *= -0.6;
      if(planetB.x < margin || planetB.x > W-margin) planetB.vx *= -0.6;
      if(planetB.y < margin || planetB.y > H-margin) planetB.vy *= -0.6;

      if(dist <= planetA.r + planetB.r){
        collisionPoint = { x:(planetA.x+planetB.x)/2, y:(planetA.y+planetB.y)/2 };
        spawnExplosion(collisionPoint.x, collisionPoint.y);
        spawnSparkleBurst(collisionPoint.x, collisionPoint.y);
        state = 'collide';
        stateTime = 0;
      }
    }

    if(state === 'collide' && stateTime > 1800){
      state = 'bloom';
      stateTime = 0;
    }

    if(state === 'bloom' && stateTime > 900){
      state = 'text';
      stateTime = 0;
      setTimeout(()=> replayBtn.classList.add('show'), 1200);
    }

    // sparks
    for(const s of sparks){
      s.life += dt*0.06;
      s.x += s.vx; s.y += s.vy;
      s.vx *= 0.965; s.vy *= 0.965;
      s.vy += 0.02; // slight gravity
    }
    sparks = sparks.filter(s => s.life < s.maxLife);

    // shockwave rings
    for(const r of rings){
      r.radius += r.speed * (dt/16.67);
      r.alpha -= dt*0.0022;
    }
    rings = rings.filter(r => r.alpha > 0);

    if(flash > 0) flash = Math.max(0, flash - dt*0.006);

    // sparkles: burst ones drift, settle into gentle falling/swaying loop
    for(const p of sparkles){
      p.swayPhase += p.swaySpeed*dt*0.06;
      const age = performance.now() - p.born;
      const burstMs = p.burstMs || 900;
      if(age < burstMs){
        // initial burst outward -- covers a wide spread of the screen
        // before settling into the falling rain, so the burst feels like
        // one organic explosion rather than a tight cluster in the middle
        p.x += p.vx * (1 - age/burstMs);
        p.y += p.vy * (1 - age/burstMs);
        p.vx *= 0.978; p.vy *= 0.978;
        // keep the burst within the screen bounds (with a little overhang)
        // rather than letting fast sparkles fly off past the edges
        if(p.x < -10 || p.x > W+10) p.vx *= -0.5;
        p.x = Math.max(-10, Math.min(W+10, p.x));
        if(p.y < -10) p.vy *= -0.5;
        p.y = Math.max(-10, p.y);
      } else {
        p.x += Math.sin(p.swayPhase)*0.6;
        p.y += p.fallSpeed;
      }
      if(p.y > H + 20){
        p.y = -20;
        p.x = Math.random()*W;
      }
    }

    // keep a light continuous flurry of sparkles once blooming has started
    if(state === 'bloom' || state === 'text'){
      ambientSparkleTimer += dt;
      if(ambientSparkleTimer > 220 && sparkles.length < 220){
        ambientSparkleTimer = 0;
        const p = makeSparkle(Math.random()*W, -20, false);
        sparkles.push(p);
      }
    }
  }

  // Shared retro dialog-box + pixel-text renderer, drawn straight into the
  // low-res pixel buffer (rather than as DOM/CSS text) so both messages get
  // identical chunky pixel edges and colors, with no dependency on a web
  // font. `lines` is [{text, size}, ...]; returns the box geometry so a
  // caller can anchor other elements (like the start button) to it.
  function drawPixelPanel(cx, centerY, lines, opts){
    opts = opts || {};
    const alpha = opts.alpha !== undefined ? opts.alpha : 1;
    const bob = opts.bob || 0;
    const lineGap = opts.lineGap || 1.3;
    const padTop = opts.padTop !== undefined ? opts.padTop : 0.6;
    const padBottom = opts.padBottom !== undefined ? opts.padBottom : 0.65;
    const extraBottom = opts.extraBottom || 0;

    const maxSize = Math.max(...lines.map(l => l.size));

    ctx.save();
    let maxW = 0;
    for(const l of lines){
      ctx.font = `bold ${l.size}px 'Courier New', monospace`;
      maxW = Math.max(maxW, ctx.measureText(l.text).width);
    }
    const boxW = maxW + maxSize*1.3;

    const slotHeights = lines.map(l => l.size*lineGap);
    const totalLinesH = slotHeights.reduce((a,b) => a+b, 0);
    const boxH = totalLinesH + maxSize*(padTop+padBottom) + extraBottom;
    const boxTop = centerY - boxH/2 + bob;
    const boxBottom = boxTop + boxH;
    const contentBottom = boxTop + maxSize*padTop + totalLinesH;

    if(alpha > 0.002){
      ctx.globalAlpha = alpha;
      ctx.fillStyle = 'rgba(4,1,10,0.72)';
      ctx.fillRect(cx-boxW/2, boxTop, boxW, boxH);
      const borderW = Math.max(2, Math.round(maxSize*0.07));
      ctx.lineWidth = borderW;
      ctx.strokeStyle = 'rgba(57,197,187,0.6)';
      ctx.strokeRect(cx-boxW/2+borderW/2, boxTop+borderW/2, boxW-borderW, boxH-borderW);

      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const mainColor = '#fff8fc', shadowA = '#39c5bb', shadowB = '#0d3f3b';
      let y = boxTop + maxSize*padTop;
      lines.forEach((l, i) => {
        const slot = slotHeights[i];
        const ty = y + slot/2;
        const off = Math.max(1, Math.round(l.size*0.11));
        ctx.font = `bold ${l.size}px 'Courier New', monospace`;
        ctx.fillStyle = shadowB;
        ctx.fillText(l.text, cx+off*2, ty+off*2);
        ctx.fillStyle = shadowA;
        ctx.fillText(l.text, cx+off, ty+off);
        ctx.fillStyle = mainColor;
        ctx.fillText(l.text, cx, ty);
        y += slot;
      });
    }
    ctx.restore();
    ctx.globalAlpha = 1;

    return { boxTop, boxBottom, boxH, boxW, contentBottom };
  }

  // "HAPPY BIRTHDAY" / name reveal
  function drawRetroText(t){
    if(state !== 'bloom' && state !== 'text'){
      cakeGif.style.opacity = 0;
      return;
    }

    let alpha = 0, rise = 16, bob = 0;
    if(state === 'text'){
      const p = Math.min(1, stateTime/1500);
      const eased = 1 - Math.pow(1-p, 3); // ease-out
      alpha = eased;
      rise = 16*(1-eased);
      // gentle continuous up/down bob once it's settled in, like a live retro prompt
      bob = Math.sin(t*0.0022) * Math.max(3, Math.min(W,H)*0.012) * eased;
    }
    if(alpha <= 0.002){
      cakeGif.style.opacity = 0;
      return;
    }

    const baseSize = Math.max(24, Math.min(W,H)*0.09);
    const subSize = baseSize*0.66;

    // gif now lives inside the same panel as the text, below it, so reserve
    // room for it in the box's own height instead of drawing a second box
    const gifSize = Math.max(48, Math.min(W,H)*0.15);
    const gifGapTop = Math.min(W,H)*0.025;
    const gifGapBottom = Math.min(W,H)*0.02;
    const extraBottom = gifSize + gifGapTop + gifGapBottom;

    const box = drawPixelPanel(W/2, H/2, [
      { text: 'HAPPY', size: baseSize },
      { text: 'BIRTHDAY', size: baseSize },
      { text: 'MELI <3', size: subSize }
    ], { alpha, bob: bob-rise, lineGap: 1.15, padTop: 0.55, padBottom: 0.6, extraBottom });

    // sit just below the text, inside the same panel
    cakeGif.style.width = gifSize + 'px';
    cakeGif.style.height = gifSize + 'px';
    cakeGif.style.left = (W/2) + 'px';
    cakeGif.style.top = (box.contentBottom + gifGapTop) + 'px';
    cakeGif.style.opacity = alpha;
  }

  // intro message -- same font, colors, dialog box and bounce as the
  // "HAPPY BIRTHDAY" reveal, so both feel like one consistent retro UI.
  function drawIntroText(t){
    // same size/font as the final "HAPPY BIRTHDAY" message, with a small
    // auto-shrink safety net so the longest line never overflows narrow screens
    const baseSize = Math.max(24, Math.min(W,H)*0.09);
    const bob = Math.sin(t*0.0022) * Math.max(3, Math.min(W,H)*0.012);
    const texts = ['TO THE MOST', 'BEAUTIFUL GIRL', 'TO EVER EXIST'];

    ctx.font = `bold ${baseSize}px 'Courier New', monospace`;
    let maxW = 0;
    for(const line of texts) maxW = Math.max(maxW, ctx.measureText(line).width);
    const naturalBoxW = maxW + baseSize*1.3;
    const scale = Math.min(1, (W*0.92) / naturalBoxW);
    const size = baseSize*scale;

    const lines = texts.map(text => ({ text, size }));
    const box = drawPixelPanel(W/2, H*0.32, lines, { alpha: 1, bob, lineGap: 1.15, padTop: 0.55, padBottom: 0.6 });

    // keep the start button anchored just below the box, wherever it ends up
    startBtn.style.top = Math.round(box.boxBottom + Math.min(W,H)*0.075) + 'px';
  }

  function renderWorld(t){
    drawBackground(t);

    if(state === 'orbit' || state === 'collide'){
      if(!(state==='collide' && stateTime>250)){
        drawPlanet(planetA);
        drawPlanet(planetB);
      }
    }

    for(const r of rings){
      ctx.strokeStyle = r.color;
      ctx.globalAlpha = Math.max(0, r.alpha);
      ctx.lineWidth = r.width;
      heartPathAt(r.x, r.y, r.radius*1.3, 26);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    for(const s of sparks){
      const alpha = Math.max(0, 1 - s.life/s.maxLife);
      ctx.globalAlpha = alpha;
      ctx.fillStyle = s.color;
      heartPathAt(s.x, s.y, s.r*1.3, 10);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    for(const p of sparkles){
      drawSparkle(p);
    }

    if(flash > 0){
      ctx.fillStyle = `rgba(255,220,240,${flash*0.85})`;
      ctx.fillRect(0,0,W,H);
    }

    drawRetroText(t);
    if(!running) drawIntroText(t);
  }

  function render(t){
    // draw the whole scene into a small low-res buffer...
    ctx = pctx;
    ctx.clearRect(0,0,pixCanvas.width,pixCanvas.height);
    ctx.save();
    ctx.scale(pixCanvas.width / W, pixCanvas.height / H);
    renderWorld(t);
    ctx.restore();

    // ...then blit it up to full size with no smoothing, for the chunky pixel look.
    // Draw in raw physical pixels with an identity transform (rather than
    // relying on the DPR transform matrix to do part of the scaling) and
    // re-assert imageSmoothingEnabled immediately before the call -- some
    // Safari/WebKit versions don't reliably honor smoothing=false when a
    // drawImage scale is combined with an active transform-matrix scale,
    // which was showing up as soft/blurry edges on iPhone.
    ctx = displayCtx;
    ctx.setTransform(1,0,0,1,0,0);
    ctx.imageSmoothingEnabled = false;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(pixCanvas, 0,0,pixCanvas.width,pixCanvas.height, 0,0,canvas.width,canvas.height);
  }

  let last = performance.now();
  let running = false;
  function loop(now){
    const dt = Math.min(now - last, 40);
    last = now;
    update(dt, now);
    render(now);
    if(running) requestAnimationFrame(loop);
  }

  function start(){
    if(running) return;
    running = true;
    last = performance.now();
    requestAnimationFrame(loop);
  }

  // idle preview behind the intro screen
  function idleRender(){
    render(performance.now());
    if(!running) requestAnimationFrame(idleRender);
  }
  idleRender();

  startBtn.addEventListener('click', () => {
    introEl.classList.add('hidden');
    start();
  });

  replayBtn.addEventListener('click', () => {
    reset();
    running = false;
    introEl.classList.remove('hidden');
    idleRender();
  });

})();
</script>
</body>
</html>
